# AI 新闻自动搬运（云端）
# 个人账号网页版路线：cookies 从 secret 解码 → Playwright 无头浏览器发布图文 → 回写最新 cookies
# 状态持久化：上次运行的 data/app.db 作为 artifact 下载/上传，保证跨运行去重
name: AI News Auto Run

on:
  schedule:
    - cron: "0 */4 * * *"   # 每 4 小时（北京时间 08/12/16/20/00/04 点）
  workflow_dispatch: {}

jobs:
  auto-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download previous state (dedup DB)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: app-state
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Prepare config and cookies
        run: |
          cp config.yaml.example config.yaml
          mkdir -p data
          echo "$DOUYIN_WEB_COOKIES_B64" | tr -d '\n' | base64 -d > data/web_cookies.json
          echo "cookies bytes: $(wc -c < data/web_cookies.json)"
          ls -la data/
        env:
          DOUYIN_WEB_COOKIES_B64: ${{ secrets.DOUYIN_WEB_COOKIES_B64 }}

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOUYIN_MODE: web
          DOUYIN_WEB_HEADLESS: "1"
        run: python main.py run --limit 5

      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: |
            data/logs/screenshots/
            data/logs/app.log

      - name: Upload state (dedup DB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-state
          path: data/app.db
          retention-days: 90
          overwrite: true

      - name: Refresh cookies back to secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AI_NEWS_PAT }}
          DOUYIN_WEB_COOKIES_B64: ${{ secrets.DOUYIN_WEB_COOKIES_B64 }}
        run: |
          if [ -f data/web_cookies.json ] && [ -n "$GH_TOKEN" ]; then
            B64=$(base64 -w0 data/web_cookies.json)
            if [ "$B64" != "$DOUYIN_WEB_COOKIES_B64" ]; then
              gh secret set DOUYIN_WEB_COOKIES_B64 --repo ${{ github.repository }} --body "$B64"
              echo "cookies refreshed and written back"
            else
              echo "cookies unchanged"
            fi
          else
            echo "skip writeback (no PAT or no cookie file)"
          fi
